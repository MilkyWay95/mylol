<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Skill-Capped Video Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }
        .container {
            background: #16213e;
            padding: 30px;
            border-radius: 12px;
        }
        h1 {
            color: #e94560;
            text-align: center;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #0f3460;
            border-radius: 8px;
            background: #0f3460;
            color: #fff;
            font-size: 14px;
            min-width: 200px;
        }
        input::placeholder {
            color: #888;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-play {
            background: #e94560;
            color: white;
        }
        .btn-play:hover {
            background: #c73652;
        }
        .btn-open {
            background: #00d2ff;
            color: #1a1a2e;
        }
        .btn-open:hover {
            background: #00b8e6;
        }
        #status {
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            background: #0f3460;
            min-height: 40px;
        }
        #status.error {
            background: #4a0e1a;
            color: #ff6b6b;
        }
        #status.success {
            background: #0e4a1a;
            color: #69db7c;
        }
        .video-container {
            margin-top: 20px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            min-height: 400px;
            display: none;
        }
        .video-container iframe {
            width: 100%;
            height: 500px;
            border: none;
        }
        .video-container .fallback {
            padding: 40px;
            text-align: center;
            color: #888;
        }
        .video-container .fallback a {
            color: #00d2ff;
        }
        .hint {
            color: #666;
            font-size: 12px;
            margin-top: 10px;
        }
        .hint a {
            color: #00d2ff;
            cursor: pointer;
        }
        .playlist-section {
            margin: 15px 0;
            padding: 15px;
            background: #0f3460;
            border-radius: 8px;
        }
        .playlist-section select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            background: #1a1a2e;
            color: #fff;
            border: 1px solid #0f3460;
            font-size: 14px;
        }
        .playlist-section select option {
            background: #1a1a2e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Skill-Capped Video Player</h1>
        
        <div class="playlist-section">
            <label style="display:block;margin-bottom:8px;color:#888;">📂 Select from playlists:</label>
            <select id="playlistSelect" onchange="loadPlaylistVideo()">
                <option value="">— Choose a video —</option>
                <optgroup label="Hwei (Master in Minutes)">
                    <option value="https://www.skill-capped.com/lol/browse/course/hd8jrqps9v/d4fytw7fl6">EP 01: Understanding Hwei's Kit</option>
                    <option value="https://www.skill-capped.com/lol/browse/course/hd8jrqps9v/8m60l9lnm0">EP 02</option>
                    <option value="https://www.skill-capped.com/lol/browse/course/hd8jrqps9v/z5t58m9lc8">EP 03</option>
                    <option value="https://www.skill-capped.com/lol/browse/course/hd8jrqps9v/p6l9scwmwv">EP 04</option>
                    <option value="https://www.skill-capped.com/lol/browse/course/hd8jrqps9v/877mhsvjf6">EP 05</option>
                    <option value="https://www.skill-capped.com/lol/browse/course/hd8jrqps9v/9rlgl2ykk4">EP 06</option>
                    <option value="https://www.skill-capped.com/lol/browse/course/hd8jrqps9v/y7c8khgb3l">EP 07</option>
                    <option value="https://www.skill-capped.com/lol/browse/course/hd8jrqps9v/1l556c1syb">EP 08</option>
                    <option value="https://www.skill-capped.com/lol/browse/course/hd8jrqps9v/yxb6pn7mh5">EP 09</option>
                    <option value="https://www.skill-capped.com/lol/browse/course/hd8jrqps9v/g5c041w9qs">EP 10</option>
                    <option value="https://www.skill-capped.com/lol/browse/course/hd8jrqps9v/284m0k07d1">EP 11</option>
                    <option value="https://www.skill-capped.com/lol/browse/course/hd8jrqps9v/dj5tbtprxt">EP 12</option>
                    <option value="https://www.skill-capped.com/lol/browse/course/hd8jrqps9v/0zlh90b6cw">EP 13</option>
                    <option value="https://www.skill-capped.com/lol/browse/course/hd8jrqps9v/f8n7rgd0rd">EP 14</option>
                </optgroup>
            </select>
        </div>

        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="Paste any Skill-Capped URL here">
            <button class="btn-play" onclick="playInIframe()">▶ Play in iframe</button>
            <button class="btn-open" onclick="openInNewTab()">🔗 Open in new tab</button>
        </div>

        <div id="status">Ready — select a video or paste a URL</div>

        <div class="video-container" id="videoContainer">
            <iframe id="videoIframe" src="about:blank"></iframe>
        </div>

        <div class="hint">
            💡 <strong>Note:</strong> Skill-Capped videos require a subscription. The iframe will show the page, but video playback may be blocked unless you're logged in.<br>
            🔗 Use <strong>"Open in new tab"</strong> to watch directly on the Skill-Capped website.
        </div>
    </div>

    <script>
        function setStatus(text, type = '') {
            const el = document.getElementById('status');
            el.textContent = text;
            el.className = type;
        }

        function showVideo() {
            document.getElementById('videoContainer').style.display = 'block';
        }

        function hideVideo() {
            document.getElementById('videoContainer').style.display = 'none';
        }

        function loadPlaylistVideo() {
            const select = document.getElementById('playlistSelect');
            const url = select.value;
            if (!url) {
                hideVideo();
                setStatus('Select a video from the list');
                return;
            }
            document.getElementById('videoUrl').value = url;
            playInIframe();
        }

        function playInIframe() {
            const url = document.getElementById('videoUrl').value.trim();
            if (!url) {
                setStatus('⚠️ Please paste a URL or select a video', 'error');
                return;
            }

            // Проверяем, что это ссылка на Skill-Capped
            if (!url.includes('skill-capped.com')) {
                setStatus('⚠️ Please enter a Skill-Capped URL', 'error');
                return;
            }

            setStatus(`⏳ Loading: ${url}...`);
            showVideo();
            
            const iframe = document.getElementById('videoIframe');
            iframe.src = url;
            
            // Таймаут для обработки ошибок
            setTimeout(() => {
                setStatus(`📺 Video page loaded. If video doesn't play, you may need to log in.`, 'success');
            }, 3000);
        }

        function openInNewTab() {
            const url = document.getElementById('videoUrl').value.trim();
            if (!url) {
                setStatus('⚠️ Please paste a URL first', 'error');
                return;
            }
            window.open(url, '_blank');
            setStatus(`🔗 Opened in new tab: ${url}`, 'success');
        }

        // Enter key support
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('videoUrl').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') playInIframe();
            });
            
            // Загружаем первый Hwei видео по умолчанию
            const defaultUrl = 'https://www.skill-capped.com/lol/browse/course/hd8jrqps9v/d4fytw7fl6';
            document.getElementById('videoUrl').value = defaultUrl;
            document.getElementById('playlistSelect').value = defaultUrl;
            setStatus('✅ Ready! Click "Play in iframe" to watch Hwei EP 01');
        });
    </script>
</body>
</html>
