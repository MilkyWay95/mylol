        // ===================== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =====================
        function getVideoId(url) {
            logDebug(`Extracting ID from: ${url}`);
            // Пробуем разные паттерны
            let match = url.match(/\/([a-z0-9]{10})$/);
            if (match) {
                logDebug(`Found ID: ${match[1]}`);
                return match[1];
            }
            
            // Пробуем второй вариант - может быть ID в середине
            match = url.match(/course\/([a-z0-9]{10})\//);
            if (match) {
                logDebug(`Found course ID: ${match[1]}`);
                return match[1];
            }
            
            logDebug('No ID found in URL');
            return null;
        }

        function setStatus(message, isError = false) {

        // ===================== ПОИСК СЕГМЕНТОВ ВИДЕО =====================
        async function findVideoSegments(videoId) {
            logDebug(`Searching segments for ID: ${videoId}`);
            videoSegments = [];
            
            // Пробуем разные форматы URL для сегментов
            const cdnPatterns = [
                `https://d13z5uuzt1wkbz.cloudfront.net/${videoId}/HIDDEN4500-`,
                `https://d3b5j9m8n7k6.cloudfront.net/${videoId}/HIDDEN4500-`,
                `https://cdn.skill-capped.com/videos/${videoId}/`
            ];
            
            let foundAny = false;
            
            for (const baseUrl of cdnPatterns) {
                logDebug(`Trying pattern: ${baseUrl}`);
                let lastSegment = 0;
                
                // Быстрый поиск - проверяем только несколько позиций
                for (let i = 1; i <= 200; i += 10) {
                    const segmentUrl = `${baseUrl}${String(i).padStart(5, "0")}.ts`;
                    try {
                        const response = await fetch(segmentUrl, { method: 'HEAD' });
                        if (response.ok) {
                            lastSegment = i;
                            logDebug(`Found segment at: ${i}`);
                            foundAny = true;
                        } else if (i > 10 && lastSegment === 0) {
                            // Если первые 10 не найдены, пробуем другой паттерн
                            break;
                        }
                    } catch (e) {
                        // Пропускаем
                    }
                }
                
                if (lastSegment > 0) {
                    // Точный сбор сегментов вокруг найденного
                    const start = Math.max(1, lastSegment - 20);
                    const end = lastSegment + 20;
                    
                    for (let i = start; i <= end; i++) {
                        const segmentUrl = `${baseUrl}${String(i).padStart(5, "0")}.ts`;
                        try {
                            const response = await fetch(segmentUrl, { method: 'HEAD' });
                            if (response.ok) {
                                videoSegments.push({
                                    url: segmentUrl,
                                    number: i
                                });
                                logDebug(`Added segment ${i}`);
                            }
                        } catch (e) {
                            // Пропускаем
                        }
                    }
                    
                    if (videoSegments.length > 0) {
                        logDebug(`Found ${videoSegments.length} segments with pattern: ${baseUrl}`);
                        break;
                    }
                }
            }
            
            if (videoSegments.length > 0) {
                setStatus(`✅ Found ${videoSegments.length} video segments`);
                return true;
            } else {
                setStatus(`❌ No segments found for ${videoId}`, true);
                logDebug('No segments found with any pattern');
                return false;
            }
        }

        // ===================== СОЗДАНИЕ HLS ПЛЕЙЛИСТА =====================
        function createHLSPlaylist() {
            let playlist = "#EXTM3U\n";
            playlist += "#EXT-X-VERSION:3\n";
            playlist += "#EXT-X-TARGETDURATION:10\n";
            playlist += "#EXT-X-MEDIA-SEQUENCE:0\n";
            playlist += "#EXT-X-PLAYLIST-TYPE:VOD\n";
            
            videoSegments.forEach(segment => {
                playlist += `#EXTINF:10.0,\n`;
                playlist += `${segment.url}\n`;
            });
            
            playlist += "#EXT-X-ENDLIST\n";
            logDebug(`Created playlist with ${videoSegments.length} segments`);
            return playlist;
        }

        // ===================== ВОСПРОИЗВЕДЕНИЕ ВИДЕО =====================
        async function playVideoById(videoId, videoName) {
            const videoEl = document.getElementById('video');
            
            if (!videoId) {
                setStatus('❌ Invalid video ID', true);
                return false;
            }

            setStatus(`⏳ Loading video ${videoId}...`);
            document.getElementById('downloadBtn').style.display = 'none';
            
            try {
                // Ищем сегменты
                const found = await findVideoSegments(videoId);
                if (!found || videoSegments.length === 0) {
                    setStatus(`❌ Could not find segments for ${videoId}`, true);
                    return false;
                }

                // Создаём плейлист
                const playlist = createHLSPlaylist();
                const blobUrl = URL.createObjectURL(new Blob([playlist], { type: 'application/x-mpegURL' }));

                // Уничтожаем старый HLS инстанс
                if (hls) {
                    hls.destroy();
                    hls = null;
                }

                // Проверяем поддержку HLS
                if (Hls.isSupported()) {
                    hls = new Hls({
                        maxBufferLength: 30,
                        maxMaxBufferLength: 60
                    });
                    hls.loadSource(blobUrl);
                    hls.attachMedia(videoEl);
                    
                    return new Promise((resolve) => {
                        hls.on(Hls.Events.MANIFEST_PARSED, function() {
                            videoEl.play().catch(e => console.log('Autoplay blocked:', e));
                            setStatus(`▶️ Now playing: ${videoName || 'Video'}`);
                            document.getElementById('downloadBtn').style.display = 'inline-block';
                            logDebug('Playback started successfully');
                            resolve(true);
                        });
                        
                        hls.on(Hls.Events.ERROR, function(event, data) {
                            console.error('HLS Error:', data);
                            setStatus(`❌ HLS error: ${data.type}`, true);
                            logDebug(`HLS Error: ${JSON.stringify(data)}`);
                            resolve(false);
                        });
                    });
                } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
                    // Safari native HLS
                    videoEl.src = blobUrl;
                    videoEl.play().catch(e => console.log('Autoplay blocked:', e));
                    setStatus(`▶️ Now playing: ${videoName || 'Video'}`);
                    document.getElementById('downloadBtn').style.display = 'inline-block';
                    return true;
                } else {
                    setStatus('❌ HLS not supported in this browser', true);
                    return false;
                }
            } catch (error) {
                console.error('Play error:', error);

        // ===================== СКАЧИВАНИЕ ПО ССЫЛКЕ ИЗ ПОЛЯ =====================
        async function downloadCustomUrl() {
            const input = document.getElementById('customUrl');
            const url = input.value.trim();
            
            if (!url) {
                setCustomStatus('⚠️ Please paste a video URL first', true);
                return;
            }

            const videoId = getVideoId(url);
            if (!videoId) {
                setCustomStatus('❌ Invalid URL format', true);
                return;
            }

            const statusLabel = document.getElementById('customStatus');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('downloadProgress');
            
            statusLabel.textContent = '⏳ Preparing download...';
            progressContainer.style.display = 'block';
            progressBar.style.width = '0%';
            progressBar.textContent = '0%';
            
            try {
                // Находим сегменты
                const found = await findVideoSegments(videoId);
                if (!found || videoSegments.length === 0) {
                    throw new Error("Could not find video segments");
                }

                const chunks = [];
                let downloaded = 0;
                const totalSegments = videoSegments.length;
                
                for (let i = 0; i < totalSegments; i++) {
                    const segment = videoSegments[i];
                    statusLabel.textContent = `📥 Downloading segment ${i+1}/${totalSegments}...`;
                    
                    try {
                        const response = await fetch(segment.url);
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        
                        const buffer = await response.arrayBuffer();
                        chunks.push(buffer);
                        downloaded++;
                        
                        const progress = Math.round((downloaded / totalSegments) * 100);
                        progressBar.style.width = `${progress}%`;
                        progressBar.textContent = `${progress}%`;
                        
                    } catch (error) {
                        console.error(`Failed to download segment ${i+1}:`, error);
                        logDebug(`Segment ${i+1} download failed: ${error.message}`);
                    }
                }
                
                if (chunks.length === 0) {
                    throw new Error("No segments were downloaded");
                }
                
                statusLabel.textContent = "📦 Combining segments...";
                const fullBlob = new Blob(chunks, { type: 'video/MP2T' });
                const videoUrl = URL.createObjectURL(fullBlob);
                
                const a = document.createElement('a');
                a.href = videoUrl;
                a.download = `video_${videoId}.ts`;
                document.body.appendChild(a);
                a.click();
                
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(videoUrl);
                    statusLabel.textContent = "✅ Download completed!";
                    logDebug('Download completed successfully');
                    setTimeout(() => {
                        progressContainer.style.display = 'none';
                    }, 2000);
                }, 100);
                
            } catch (error) {
                console.error('Download failed:', error);
                statusLabel.textContent = `❌ Download failed: ${error.message}`;
                progressContainer.style.display = 'none';
                logDebug(`Download error: ${error.message}`);
            }
        }

        function playSelected() {

            const videoUrl = urlSelect.value;

                return;
            }
            
            currentVideoId = videoId;
            currentVideoName = urlSelect.options[urlSelect.selectedIndex].text;
            
            playVideoById(videoId, currentVideoName);
        }
